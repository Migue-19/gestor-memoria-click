# Variante ANTES (solo Java, linea base de RQ-03):
#   docker compose -f deploy/docker-compose.java.yml up -d --build
services:
  asignador-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.java
    image: click/asignador-service:java
    ports:
      - "8080:8080"
    environment:
      ASIGNADOR_MOTOR: java
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped
