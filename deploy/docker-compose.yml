# Variante DESPUES (motor nativo). Un solo comando desde la raiz del repositorio:
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  asignador-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: click/asignador-service:nativo
    ports:
      - "8080:8080"
    environment:
      ASIGNADOR_MOTOR: native
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped
# Pendiente: agregar aqui los servicios del frente de Web 2 (api-gateway, memoria-service,
# keycloak, frontend), cada uno con su bloque deploy.resources.limits.
