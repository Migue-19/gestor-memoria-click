# Manifiesto de despliegue del sistema Gestor de memoria.
#
# Click + (Arquitectura): asignador-service, completo y probado.
#   Comando unico desde la raiz del repositorio:
#     docker compose -f deploy/docker-compose.yml up -d --build
#
# Not Found (Web 2): servicios declarados con el perfil "web2". Los nombres, puertos y limites
# son una PROPUESTA de Click + (no hubo comunicacion con ese equipo, decision D-27). Cuando
# existan sus imagenes, el sistema completo arranca con:
#     docker compose -f deploy/docker-compose.yml --profile web2 up -d --build
services:
  asignador-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: click/asignador-service:nativo
    ports:
      - "8080:8080"
    environment:
      ASIGNADOR_MOTOR: native
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

  # ---------------- Servicios del frente de Web 2 (perfil web2) ----------------
  postgres-memoria:
    profiles: ["web2"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: memoria
      POSTGRES_USER: memoria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar-en-produccion}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped

  memoria-service:            # bloques, solicitudes y estado; llama a asignador-service
    profiles: ["web2"]
    image: notfound/memoria-service:latest      # REEMPLAZAR por la imagen de Not Found
    depends_on: [postgres-memoria, asignador-service]
    environment:
      ASIGNADOR_URL: http://asignador-service:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-memoria:5432/memoria
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped

  keycloak:                   # OAuth 2.0 / OIDC; el realm lo aporta Not Found
    profiles: ["web2"]
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8180:8080"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    restart: unless-stopped

  api-gateway:                # supuesto: tercer microservicio (punto de entrada unico)
    profiles: ["web2"]
    image: notfound/api-gateway:latest          # REEMPLAZAR por la imagen de Not Found
    depends_on: [memoria-service, keycloak]
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
    restart: unless-stopped

  frontend:                   # Angular servido por nginx
    profiles: ["web2"]
    image: notfound/frontend:latest             # REEMPLAZAR por la imagen de Not Found
    depends_on: [api-gateway]
    ports:
      - "4200:80"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    restart: unless-stopped
